<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="v1.1.0/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="v1.1.0/assets/apple-touch-icon.png" sizes="180x180">
  <title>版本列表 · Pokemon GO 活動曆</title>
  <style>
    :root { --bg: #fbf8f3; --surface: #fff; --ink: #1f2030; --ink-2: #6b6d7c; --line: #e7e1d7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16171c; --surface: #1f2128; --ink: #f1f0ee; --ink-2: #a5a7b2; --line: #33353f; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; } a { color: inherit; }
    ul { list-style: none; padding: 0; display: grid; gap: 10px; }
    li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .v { font-weight: 700; font-size: 17px; text-decoration: none; }
    .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
    .stable { background: #d3f9d8; color: #1b5e20; } .test { background: #fff3bf; color: #6b4e00; } .archived { background: #e9ecef; color: #495057; }
    p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Pokemon GO 活動曆 · 版本</h1>
    <ul id="list"><li>載入中…</li></ul>
    <p><a href="./">回首頁</a></p>
  </main>
  <script>
    const label = { stable: '正式版', test: '測試版', archived: '已封存' };
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    fetch('versions.json', { cache: 'no-store' }).then((r) => r.json()).then((vs) => {
      document.getElementById('list').innerHTML = vs.slice().reverse().map((v) => `
        <li><a class="v" href="${esc(v.version)}/">${esc(v.version)}</a><span class="tag ${esc(v.status)}">${label[v.status] || esc(v.status)}</span>
        <p>${esc(v.date)}${v.notes ? ' · ' + esc(v.notes) : ''}</p></li>`).join('');
    });
  </script>
</body>
</html>
